<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forecourt</title>
<meta name="description" content="Petrol spend and fuel economy for our two cars, shared.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D3B3E">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecourt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --plane:#EAEFEE;
  --card:#FBFCFC;
  --card2:#F1F5F4;
  --ink:#0B1F20;
  --ink2:#4E605F;
  --ink3:#7C8D8B;
  --line:#DAE3E1;
  --line2:#E6EDEB;
  --brand:#0D3B3E;
  --brand-hover:#0A2E30;
  --brand-ink:#FFFFFF;
  --slab:#0D3B3E;
  --slab-ink:#F4FAF9;
  --slab-ink2:#8FB3B2;
  --slab-line:rgba(255,255,255,0.16);
  --c1:#2a78d6;
  --c2:#eb6834;
  --up:#C4302F;
  --down:#006300;
  --focus:#2a78d6;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,31,32,.05), 0 8px 20px -14px rgba(11,31,32,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#070C0C;
    --card:#141D1C;
    --card2:#1B2524;
    --ink:#EEF4F3;
    --ink2:#A6B7B5;
    --ink3:#7C8D8B;
    --line:#27322F;
    --line2:#1F2A28;
    --brand:#2F8078;
    --brand-hover:#398F87;
    --brand-ink:#F2FBFA;
    --slab:#0F1B1A;
    --slab-ink:#EEF4F3;
    --slab-ink2:#8FA8A6;
    --slab-line:rgba(255,255,255,0.10);
    --c1:#3987e5;
    --c2:#d95926;
    --up:#e66767;
    --down:#0ca30c;
    --focus:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plane:#070C0C;
  --card:#141D1C;
  --card2:#1B2524;
  --ink:#EEF4F3;
  --ink2:#A6B7B5;
  --ink3:#7C8D8B;
  --line:#27322F;
  --line2:#1F2A28;
  --brand:#2F8078;
  --brand-hover:#398F87;
  --brand-ink:#F2FBFA;
  --slab:#0F1B1A;
  --slab-ink:#EEF4F3;
  --slab-ink2:#8FA8A6;
  --slab-line:rgba(255,255,255,0.10);
  --c1:#3987e5;
  --c2:#d95926;
  --up:#e66767;
  --down:#0ca30c;
  --focus:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--plane);
  color:var(--ink);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(56px + env(safe-area-inset-bottom));}

/* ---------- slab ---------- */
.slab{
  background:var(--slab);
  color:var(--slab-ink);
  padding:calc(18px + env(safe-area-inset-top)) 20px 20px;
  border-bottom:1px solid var(--slab-line);
}
.slab-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
.mark{
  font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:14px;
  letter-spacing:.22em;text-transform:uppercase;margin:0;color:var(--slab-ink);
}
.mark span{color:var(--slab-ink2);}
.readout-label{
  font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--slab-ink2);
  margin:0 0 6px;
}
.total{display:flex;align-items:flex-start;gap:8px;}
.total .cur{
  font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:18px;
  color:var(--slab-ink2);margin-top:.55em;letter-spacing:.02em;
}
.total .fig{
  font-family:'Archivo',Arial,sans-serif;font-weight:800;
  font-size:clamp(3.1rem,15vw,4.4rem);line-height:.86;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.delta{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;color:var(--slab-ink2);}
.delta b{font-family:'Archivo',Arial,sans-serif;font-variant-numeric:tabular-nums;font-weight:700;}
.delta .arw{font-size:14px;line-height:1;}
.delta.is-up b,.delta.is-up .arw{color:#FF9A8B;}
.delta.is-down b,.delta.is-down .arw{color:#7FD98C;}
.readouts{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  margin-top:20px;background:var(--slab-line);
  border:1px solid var(--slab-line);border-radius:10px;overflow:hidden;
}
.readouts div{background:var(--slab);padding:11px 12px;}
.readouts .rv{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.readouts .rl{font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--slab-ink2);margin-top:2px;}

/* ---------- sync pill ---------- */
.syncpill{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  background:rgba(255,255,255,.07);border:1px solid var(--slab-line);
  color:var(--slab-ink2);border-radius:999px;padding:6px 11px 6px 9px;cursor:pointer;
  font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;
}
.syncpill:hover{background:rgba(255,255,255,.12);color:var(--slab-ink);}
.syncpill:focus-visible{outline:2px solid var(--slab-ink2);outline-offset:2px;}
.syncpill .led{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
.syncpill[data-s="ok"]{color:#7FD98C;}
.syncpill[data-s="busy"]{color:#E8C468;}
.syncpill[data-s="busy"] .led{animation:pulse 1.1s ease-in-out infinite;}
.syncpill[data-s="err"]{color:#FF9A8B;}
.syncpill[data-s="offline"]{color:var(--slab-ink2);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- generic ---------- */
.stack{display:flex;flex-direction:column;gap:14px;padding:16px 16px 0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
h2{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0;}
.hint{font-size:12px;color:var(--ink3);}

/* ---------- add form ---------- */
details.add{border:0;}
details.add > summary{list-style:none;}
details.add > summary::-webkit-details-marker{display:none;}
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--brand);color:var(--brand-ink);
  font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.02em;padding:16px;border-radius:var(--radius);cursor:pointer;
  user-select:none;transition:background .15s ease;
}
.add-btn:hover{background:var(--brand-hover);}
.add-btn .plus{font-size:19px;line-height:1;font-weight:600;}
details.add[open] .add-btn{border-radius:var(--radius) var(--radius) 0 0;}
details.add[open] .add-btn .plus{transform:rotate(45deg);}
.form{
  background:var(--card);border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--radius) var(--radius);padding:18px 16px 16px;
  display:flex;flex-direction:column;gap:16px;
}
.seg{display:flex;gap:8px;}
.seg label{flex:1;position:relative;}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;}
.seg span{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);border-radius:10px;padding:11px 8px;
  font-weight:600;font-size:14px;color:var(--ink2);background:var(--card2);
  transition:border-color .12s ease,color .12s ease;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seg span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--dot);flex:none;}
.seg input:checked + span{border-color:var(--dot);color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--dot);}
.seg input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px;}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field.wide{grid-column:1 / -1;}
label.lbl{font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
input[type=text],input[type=url],input[type=number],input[type=date]{
  width:100%;font-family:'Archivo',Arial,sans-serif;font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;appearance:none;
}
input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:500;}
input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent;}
input::placeholder{color:var(--ink3);font-weight:500;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ppl{font-family:'Archivo',Arial,sans-serif;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em;min-height:18px;}
.ppl b{color:var(--ink);font-variant-numeric:tabular-nums;}
.warn{font-size:12.5px;color:var(--up);font-weight:600;}
.btn{
  font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:15px;
  background:var(--brand);color:var(--brand-ink);border:0;border-radius:11px;
  padding:14px;cursor:pointer;transition:background .15s ease;
}
.btn:hover{background:var(--brand-hover);}
.btn:disabled{opacity:.55;cursor:progress;}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-size:13px;padding:10px 14px;}
.btn-ghost:hover{background:var(--card2);color:var(--ink);}
.msg{font-size:13px;font-weight:600;}
.msg.err{color:var(--up);}
.msg.ok{color:var(--down);}

/* ---------- car cards ---------- */
.cars{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.carcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-top:3px solid var(--dot);min-width:0;}
.carname{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.carcard .big{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;}
.carcard .big small{font-size:13px;font-weight:600;color:var(--ink3);margin-right:3px;}
.carcard .sub{font-size:11.5px;color:var(--ink3);margin-top:2px;}
.carstats{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);}
.carstats div{min-width:0;}
.carstats .v{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
.carstats .k{font-family:'Archivo',Arial,sans-serif;font-weight:600;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);}

/* ---------- chart ---------- */
.chartbox{position:relative;}
.chartbox svg{display:block;width:100%;}
.legend{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0;}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;}
.legend em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s ease;
  background:var(--slab);color:var(--slab-ink);border-radius:9px;padding:9px 11px;
  font-size:12px;line-height:1.45;white-space:nowrap;z-index:5;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.45);border:1px solid var(--slab-line);
}
.tip .tm{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slab-ink2);}
.tip .tr{display:flex;align-items:center;gap:7px;margin-top:3px;font-variant-numeric:tabular-nums;}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none;}
.tip .tt{margin-top:5px;padding-top:5px;border-top:1px solid var(--slab-line);font-family:'Archivo',Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- log ---------- */
.monthgroup + .monthgroup{margin-top:18px;}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--line);}
.mhead .ml{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);}
.mhead .mv{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);}
.row:last-child{border-bottom:0;}
.rdot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--dot);}
.rmain{flex:1;min-width:0;}
.rdate{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rcar{font-weight:600;font-size:11.5px;color:var(--ink3);margin-left:7px;}
.rmeta{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ramt{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;}
.rsub{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right;font-family:'Archivo',Arial,sans-serif;font-weight:600;}
.del{background:none;border:0;color:var(--ink3);cursor:pointer;padding:6px;border-radius:8px;font-size:15px;line-height:1;flex:none;}
.del:hover{color:var(--up);background:var(--card2);}
.del:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
.confirm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:600;}
.confirm button{font-family:'Karla',sans-serif;font-size:12.5px;font-weight:700;border:0;border-radius:7px;padding:5px 10px;cursor:pointer;}
.confirm .yes{background:var(--up);color:#fff;}
.confirm .no{background:var(--card2);color:var(--ink2);border:1px solid var(--line);}
.showall{width:100%;margin-top:16px;}
.empty{text-align:center;padding:26px 12px;color:var(--ink3);font-size:14px;}
.empty strong{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px;}

/* ---------- settings + modal ---------- */
details.set > summary{
  list-style:none;cursor:pointer;font-family:'Archivo',Arial,sans-serif;font-weight:700;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  padding:12px 0;text-align:center;
}
details.set > summary::-webkit-details-marker{display:none;}
details.set > summary:hover{color:var(--ink2);}
.setbody{display:flex;flex-direction:column;gap:14px;}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);padding:6px 20px 0;line-height:1.6;}

#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(6,18,18,.55);padding:0;}
#modal.on{display:flex;}
.sheet{
  background:var(--card);width:100%;max-width:560px;
  border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;
  border-top:1px solid var(--line);
}
@media (min-width:600px){
  #modal{align-items:center;padding:20px;}
  .sheet{border-radius:18px;border:1px solid var(--line);}
}
.sheet h3{font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:-.01em;}
.sheet p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.55;}
.sheet .close{position:absolute;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.xbtn{background:none;border:0;font-size:20px;line-height:1;color:var(--ink3);cursor:pointer;padding:4px 6px;border-radius:8px;}
.xbtn:hover{color:var(--ink);background:var(--card2);}
.linkrow{display:flex;gap:8px;}
.linkrow input{flex:1;min-width:0;}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
  background:var(--slab);color:var(--slab-ink);border:1px solid var(--slab-line);
  padding:11px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s ease;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
}
.toast.on{opacity:1;}
.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
@media (max-width:380px){
  .fields{grid-template-columns:1fr;}
  .cars{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="slab">
    <div class="slab-top">
      <h1 class="mark">Fore<span>court</span></h1>
      <button class="syncpill" id="syncPill" data-s="off" type="button" aria-label="Sync status and sharing">
        <span class="led"></span><span id="syncTxt">Local</span>
      </button>
    </div>
    <p class="readout-label" id="heroLabel">Fuel this month</p>
    <div class="total">
      <span class="cur">QR</span>
      <span class="fig" id="heroTotal">0.00</span>
    </div>
    <div class="delta" id="heroDelta"></div>
    <div class="readouts">
      <div><div class="rv" id="roLitres">—</div><div class="rl">Litres</div></div>
      <div><div class="rv" id="roFills">—</div><div class="rl">Fill-ups</div></div>
      <div><div class="rv" id="roPpl">—</div><div class="rl">Avg QR / L</div></div>
    </div>
  </div>

  <div class="stack">

    <details class="add" id="addPanel">
      <summary class="add-btn"><span class="plus">+</span> Log a fill-up</summary>
      <form class="form" id="addForm" novalidate>
        <div class="seg" id="carSeg" role="radiogroup" aria-label="Which car"></div>
        <div class="fields">
          <div class="field">
            <label class="lbl" for="fAmount">Amount (QR)</label>
            <input id="fAmount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" autocomplete="off">
          </div>
          <div class="field">
            <label class="lbl" for="fLitres">Litres</label>
            <input id="fLitres" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" autocomplete="off">
          </div>
          <div class="field">
            <label class="lbl" for="fOdo">Odometer (km)</label>
            <input id="fOdo" type="number" step="1" min="0" inputmode="numeric" placeholder="0" autocomplete="off">
          </div>
          <div class="field">
            <label class="lbl" for="fDate">Date</label>
            <input id="fDate" type="date">
          </div>
        </div>
        <div class="ppl" id="pplHint"></div>
        <div class="warn hidden" id="odoWarn"></div>
        <button class="btn" type="submit" id="saveBtn">Save fill-up</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </details>

    <div class="cars" id="carCards"></div>

    <div class="card" id="chartCard">
      <div class="card-head">
        <h2>Monthly spend</h2>
        <span class="hint" id="chartHint"></span>
      </div>
      <div class="chartbox" id="chartBox">
        <svg id="chart" role="img" aria-label="Monthly fuel spend by car"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Fill-ups</h2>
        <span class="hint" id="logHint"></span>
      </div>
      <div id="log"></div>
    </div>

    <details class="set">
      <summary>Cars &amp; data</summary>
      <div class="card setbody">
        <div class="fields" id="carNames"></div>
        <button class="btn btn-ghost" type="button" id="saveNames">Save car names</button>
        <button class="btn btn-ghost" type="button" id="exportBtn">Download all fill-ups (CSV)</button>
        <button class="btn btn-ghost" type="button" id="shareBtn">Sharing &amp; sync</button>
        <div class="msg" id="setMsg"></div>
      </div>
    </details>

    <p class="foot" id="foot"></p>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   Forecourt — petrol spend for two cars.
   Same shape as Meal Plan: a single file on Pages, data in
   Supabase over PostgREST, config carried in the URL hash.
   ========================================================= */

var CFG_KEY = "forecourt.cfg";
var DB_KEY  = "forecourt.v1";

var SERIES = ['var(--c1)','var(--c2)'];
var showAll = false;

/* ---------- storage ---------- */
function lsGet(k, fallback){
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

var cfg = lsGet(CFG_KEY, {url:"", key:"", hh:""});
var db  = lsGet(DB_KEY, {items:{}, pending:{}});
if (!db.items) db.items = {};
if (!db.pending) db.pending = {};

function saveCfg(){ lsSet(CFG_KEY, cfg); }
function saveDb(){ lsSet(DB_KEY, db); }
function connected(){ return !!(cfg.url && cfg.key && cfg.hh); }

/* ---------- base64url ---------- */
function b64e(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(b64){
  var s = atob(b64.replace(/-/g,"+").replace(/_/g,"/"));
  var bytes = new Uint8Array(s.length);
  for (var i=0;i<s.length;i++) bytes[i] = s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function readHash(){
  var m = /[#&]s=([A-Za-z0-9\-_]+)/.exec(location.hash);
  if (!m) return false;
  try {
    var o = JSON.parse(b64d(m[1]));
    if (!o.u || !o.k || !o.h) return false;
    cfg.url = o.u; cfg.key = o.k; cfg.hh = o.h; saveCfg();
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  } catch(e){ return false; }
}
function shareLink(){
  return location.origin + location.pathname + "#s=" + b64e(JSON.stringify({u:cfg.url,k:cfg.key,h:cfg.hh}));
}

/* ---------- items ---------- */
function nowISO(){ return new Date().toISOString(); }
/* Compare as instants, not strings: Postgres hands back "+00:00" with
   microseconds, the browser writes "Z" with milliseconds. */
function ts(x){ var n = Date.parse(x); return isNaN(n) ? 0 : n; }
function rid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function put(id, kind, doc, deleted){
  db.items[id] = { id:id, kind:kind, doc:doc, deleted:!!deleted, updated_at:nowISO() };
  db.pending[id] = true;
  saveDb();
}
function live(kind){
  var out = [];
  for (var id in db.items){
    var it = db.items[id];
    if (it.kind === kind && !it.deleted) out.push(it);
  }
  return out;
}

function cars(){
  return live("car")
    .sort(function(a,b){ return (a.doc.order||0) - (b.doc.order||0) || (a.id < b.id ? -1 : 1); })
    .map(function(it){ return { id:it.id, name:it.doc.name, order:it.doc.order }; });
}
function fills(){
  return live("fill").map(function(it){
    return { id:it.id, date:it.doc.date, car:it.doc.car,
             amount:+it.doc.amount, litres:+it.doc.litres, odo:+it.doc.odo };
  });
}
/* A device that has never synced still needs two cars to show a form for.
   It seeds them stamped at the epoch so that the moment a real pull arrives,
   whatever the household already agreed on wins over these placeholders.
   They are only pushed once a successful pull proves the household has none. */
var PROVISIONAL = "1970-01-01T00:00:00.000Z";

function ensureCars(){
  if (live("car").length) return;
  [["c-a","Car 1",0],["c-b","Car 2",1]].forEach(function(c){
    db.items[c[0]] = { id:c[0], kind:"car", doc:{name:c[1], order:c[2]},
                       deleted:false, updated_at: connected() ? PROVISIONAL : nowISO() };
    if (!connected()) db.pending[c[0]] = true;
  });
  saveDb();
}

function adoptProvisionalCars(){
  var promoted = false;
  live("car").forEach(function(it){
    if (it.updated_at === PROVISIONAL){
      it.updated_at = nowISO();
      db.pending[it.id] = true;
      promoted = true;
    }
  });
  if (promoted) saveDb();
  return promoted;
}

/* ---------- sync ---------- */
var syncing = false, syncTimer = null;

function setSync(state, title){
  var p = document.getElementById("syncPill");
  var t = document.getElementById("syncTxt");
  p.setAttribute("data-s", state);
  t.textContent = { off:"Local", ok:"Synced", busy:"Syncing", err:"Sync failed", offline:"Offline" }[state] || "Local";
  p.title = title || { off:"Saved on this device only — tap to share it",
                       ok:"Up to date with your shared log",
                       busy:"Talking to the server",
                       err:"Couldn’t reach the server — tap for details",
                       offline:"No connection — changes are queued" }[state];
}

async function api(path, opts){
  opts = opts || {};
  var headers = { apikey: cfg.key, Authorization: "Bearer " + cfg.key, "Content-Type": "application/json" };
  for (var k in (opts.headers||{})) headers[k] = opts.headers[k];
  var res = await fetch(cfg.url.replace(/\/+$/,"") + "/rest/v1/" + path, {
    method: opts.method || "GET", headers: headers, body: opts.body, cache: "no-store"
  });
  if (!res.ok){
    var text = "";
    try { text = await res.text(); } catch(e){}
    var err = new Error("HTTP " + res.status + (text ? " — " + text.slice(0,140) : ""));
    err.status = res.status;
    throw err;
  }
  return res;
}

async function push(){
  var ids = Object.keys(db.pending);
  if (!ids.length) return;
  var payload = ids.map(function(id){
    var it = db.items[id];
    return { id:it.id, household:cfg.hh, kind:it.kind, doc:it.doc, deleted:it.deleted, updated_at:it.updated_at };
  });
  await api("items?on_conflict=id", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(payload)
  });
  ids.forEach(function(id){ delete db.pending[id]; });
  saveDb();
}

async function pull(){
  var res = await api("items?household=eq." + encodeURIComponent(cfg.hh) + "&select=id,kind,doc,deleted,updated_at");
  var rows = await res.json();
  var changed = false, remoteCars = 0;
  rows.forEach(function(r){
    if (r.kind === "car" && !r.deleted) remoteCars++;
    if (db.pending[r.id]) return;           // our unsent edit wins until it lands
    var local = db.items[r.id];
    if (!local || ts(r.updated_at) > ts(local.updated_at)){
      db.items[r.id] = r;
      changed = true;
    }
  });
  if (changed) saveDb();
  return { changed: changed, cars: remoteCars };
}

async function sync(){
  if (!connected()){ setSync("off"); return; }
  if (syncing) return;
  if (!navigator.onLine){ setSync("offline"); return; }
  syncing = true; setSync("busy");
  try {
    await push();
    var res = await pull();
    // Nobody has named the cars yet — this device's placeholders become the ones.
    if (res.cars === 0 && adoptProvisionalCars()){ await push(); res.changed = true; }
    setSync("ok");
    if (res.changed) render();
  } catch(err){
    setSync(navigator.onLine ? "err" : "offline", err.message);
  } finally {
    syncing = false;
  }
}

function queueSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 250); }

/* ---------- formatting ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function money(n){ return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ return Math.round(n).toLocaleString('en-US'); }
function num(n,d){ return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ymOf(iso){ return iso.slice(0,7); }
function ymShift(ym,k){ var p=ym.split('-'); var d=new Date(+p[0],+p[1]-1+k,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymLabel(ym,style){
  var p=ym.split('-'); var d=new Date(+p[0],+p[1]-1,1);
  if(style==='long') return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(style==='my') return d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}).toUpperCase();
  if(style==='word') return d.toLocaleDateString('en-GB',{month:'long'});
  return d.toLocaleDateString('en-GB',{month:'short'});
}
function dayLabel(iso){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }

function carOf(id){ var cs=cars(); for(var i=0;i<cs.length;i++) if(cs[i].id===id) return cs[i]; return cs[0]||{id:id,name:'Car'}; }
function carIndex(id){ var cs=cars(); for(var i=0;i<cs.length;i++) if(cs[i].id===id) return i; return 0; }
function colorOf(id){ return SERIES[carIndex(id)%SERIES.length]; }
function sortedFills(){ return fills().sort(function(a,b){ return a.date===b.date ? (b.odo-a.odo) : (a.date<b.date?1:-1); }); }

/* ---------- stats ---------- */
function distances(){
  var out = {}, all = fills();
  cars().forEach(function(c){
    var list = all.filter(function(e){ return e.car===c.id; })
      .sort(function(a,b){ return a.date===b.date ? (a.odo-b.odo) : (a.date<b.date?-1:1); });
    for (var i=1;i<list.length;i++){
      var d = list[i].odo - list[i-1].odo;
      if (d > 0) out[list[i].id] = d;
    }
  });
  return out;
}
function monthTotals(ym){
  var t = {total:0, litres:0, fills:0, byCar:{}, km:0}, D = distances();
  cars().forEach(function(c){ t.byCar[c.id] = 0; });
  fills().forEach(function(e){
    if (ymOf(e.date) !== ym) return;
    t.total += e.amount; t.litres += e.litres; t.fills++;
    if (t.byCar[e.car] === undefined) t.byCar[e.car] = 0;
    t.byCar[e.car] += e.amount;
    if (D[e.id]) t.km += D[e.id];
  });
  return t;
}
function carStats(id){
  var D = distances(), km=0, litres=0, cost=0, spend=0, last=null;
  fills().filter(function(e){ return e.car===id; }).forEach(function(e){
    spend += e.amount;
    if (!last || e.date > last.date || (e.date===last.date && e.odo>last.odo)) last = e;
    if (D[e.id]){ km += D[e.id]; litres += e.litres; cost += e.amount; }
  });
  return { spend:spend, kmpl: litres>0 ? km/litres : null, perKm: km>0 ? cost/km : null, last:last };
}

/* ---------- render ---------- */
function render(){
  var thisYm = ymOf(todayISO()), prevYm = ymShift(thisYm,-1);
  var cur = monthTotals(thisYm), prev = monthTotals(prevYm);

  document.getElementById('heroLabel').textContent = 'Fuel in ' + ymLabel(thisYm,'word');
  document.getElementById('heroTotal').textContent = money(cur.total);

  var dEl = document.getElementById('heroDelta');
  dEl.className = 'delta';
  if (prev.total > 0 && cur.total > 0){
    var pct = (cur.total - prev.total) / prev.total * 100;
    var up = pct >= 0;
    dEl.classList.add(up ? 'is-up' : 'is-down');
    dEl.innerHTML = '<span class="arw">'+(up?'▲':'▼')+'</span><b>'+num(Math.abs(pct),0)+'%</b> vs '+ymLabel(prevYm);
  } else if (prev.total > 0){
    dEl.textContent = 'Nothing logged yet this month — QR '+money(prev.total)+' in '+ymLabel(prevYm);
  } else {
    dEl.textContent = fills().length ? 'First month with fill-ups logged' : 'Log your first fill-up to start tracking';
  }

  document.getElementById('roLitres').textContent = cur.litres>0 ? num(cur.litres,1) : '—';
  document.getElementById('roFills').textContent = cur.fills || '—';
  document.getElementById('roPpl').textContent = cur.litres>0 ? num(cur.total/cur.litres,2) : '—';

  renderCarPickers();
  renderCarCards(cur);
  renderChart(thisYm);
  renderLog();
  renderFoot();
}

function renderCarCards(cur){
  document.getElementById('carCards').innerHTML = cars().map(function(c){
    var st = carStats(c.id), spent = cur.byCar[c.id] || 0;
    return '<div class="carcard" style="--dot:'+colorOf(c.id)+'">'+
      '<div class="carname"><span class="rdot" style="--dot:'+colorOf(c.id)+'"></span>'+esc(c.name)+'</div>'+
      '<div class="big"><small>QR</small>'+money(spent)+'</div>'+
      '<div class="sub">this month</div>'+
      '<div class="carstats">'+
        '<div><div class="v">'+(st.kmpl?num(st.kmpl,1):'—')+'</div><div class="k">km / L</div></div>'+
        '<div><div class="v">'+(st.perKm?num(st.perKm,2):'—')+'</div><div class="k">QR / km</div></div>'+
      '</div></div>';
  }).join('');
}

function niceMax(v){
  if (v <= 0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var steps = [1,1.2,1.4,1.5,1.6,1.8,2,2.5,3,3.5,4,4.5,5,6,7,8,9,10];
  for (var i=0;i<steps.length;i++){ if (steps[i]*mag >= v*1.02) return steps[i]*mag; }
  return 10*mag;
}
function roundedTop(x,y,w,h,r){
  r = Math.min(r, w/2, h);
  return 'M'+x+','+(y+h)+'V'+(y+r)+'a'+r+','+r+' 0 0 1 '+r+',-'+r+'h'+(w-2*r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'V'+(y+h)+'Z';
}

function renderChart(thisYm){
  var card = document.getElementById('chartCard');
  var months = [], ym = ymOf(todayISO());
  for (var i=5;i>=0;i--) months.push(ymShift(ym,-i));
  var data = months.map(function(m){ return { ym:m, t:monthTotals(m) }; });
  var max = 0; data.forEach(function(d){ if (d.t.total > max) max = d.t.total; });

  if (max <= 0){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  document.getElementById('chartHint').textContent = 'last 6 months';

  var box = document.getElementById('chartBox');
  var W = Math.max(260, box.clientWidth || 320), H = 196;
  var padT = 30, padB = 24, plotH = H - padT - padB, gap = 10, n = months.length;
  var bw = (W - gap*(n-1)) / n;
  var scaleMax = niceMax(max);
  var cs = cars();

  var s = '';
  s += '<rect x="0" y="'+(padT+plotH)+'" width="'+W+'" height="1" fill="var(--line)"/>';
  s += '<rect x="0" y="'+padT+'" width="'+W+'" height="1" fill="var(--line2)"/>';
  s += '<text x="0" y="'+(padT-9)+'" font-family="Archivo,Arial" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="var(--ink3)">QR '+money0(scaleMax)+'</text>';

  data.forEach(function(d,i){
    var x = i*(bw+gap), isNow = d.ym === thisYm, y = padT + plotH;
    var segs = cs.map(function(c){ return { id:c.id, v:d.t.byCar[c.id]||0 }; }).filter(function(o){ return o.v > 0; });
    segs.forEach(function(o,k){
      var h = (o.v/scaleMax)*plotH, top = k === segs.length-1;
      var hh = Math.max(1, h - (k < segs.length-1 ? 2 : 0)), yy = y - h;
      s += top ? '<path d="'+roundedTop(x,yy,bw,hh,4)+'" fill="'+colorOf(o.id)+'"/>'
               : '<rect x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+hh+'" fill="'+colorOf(o.id)+'"/>';
      y -= h;
    });
    if (isNow && d.t.total > 0){
      var ly = Math.max(padT - 6, padT + plotH - (d.t.total/scaleMax)*plotH - 8);
      s += '<text x="'+(x+bw/2)+'" y="'+ly+'" text-anchor="middle" font-family="Archivo,Arial" font-size="11" font-weight="700" fill="var(--ink)">'+money0(d.t.total)+'</text>';
    }
    s += '<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-family="Archivo,Arial" font-size="10" font-weight="'+(isNow?'700':'600')+'" letter-spacing="0.6" fill="'+(isNow?'var(--ink)':'var(--ink3)')+'">'+ymLabel(d.ym).toUpperCase()+'</text>';
    s += '<rect class="hit" data-i="'+i+'" x="'+(x-gap/2)+'" y="0" width="'+(bw+gap)+'" height="'+(padT+plotH)+'" fill="transparent"/>';
  });

  var svg = document.getElementById('chart');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = s;

  document.getElementById('legend').innerHTML = cs.map(function(c){
    return '<span><i style="background:'+colorOf(c.id)+'"></i><em>'+esc(c.name)+'</em></span>';
  }).join('');

  var tip = document.getElementById('tip');
  Array.prototype.forEach.call(svg.querySelectorAll('.hit'), function(r){
    function show(){
      var d = data[+r.getAttribute('data-i')];
      var html = '<div class="tm">'+ymLabel(d.ym,'my')+'</div>';
      cs.forEach(function(c){
        html += '<div class="tr"><i style="background:'+colorOf(c.id)+'"></i>'+esc(c.name)+' &nbsp;QR '+money(d.t.byCar[c.id]||0)+'</div>';
      });
      html += '<div class="tt">QR '+money(d.t.total)+' total</div>';
      tip.innerHTML = html;
      tip.style.opacity = 1;
      var cx = (+r.getAttribute('x') + (+r.getAttribute('width'))/2) * (box.clientWidth / W);
      var tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(box.clientWidth - tw, cx - tw/2)) + 'px';
      tip.style.top = '0px';
    }
    r.addEventListener('mouseenter', show);
    r.addEventListener('click', show);
    r.addEventListener('mouseleave', function(){ tip.style.opacity = 0; });
  });
}

function renderLog(){
  var el = document.getElementById('log'), list = sortedFills();
  document.getElementById('logHint').textContent = list.length ? list.length + (list.length===1?' entry':' entries') : '';
  if (!list.length){
    el.innerHTML = '<div class="empty"><strong>No fill-ups yet</strong>Next time you fill up, tap “Log a fill-up” and put in the amount, the litres and the odometer reading.</div>';
    return;
  }
  var D = distances(), groups = [], seen = {};
  list.forEach(function(e){ var m = ymOf(e.date); if (!seen[m]){ seen[m]=[]; groups.push(m); } seen[m].push(e); });
  var shown = showAll ? groups : groups.slice(0,3);
  var hidden = list.length - shown.reduce(function(a,m){ return a + seen[m].length; }, 0);

  el.innerHTML = shown.map(function(m){
    var tot = seen[m].reduce(function(a,e){ return a + e.amount; }, 0);
    return '<div class="monthgroup"><div class="mhead"><span class="ml">'+ymLabel(m,'long')+'</span><span class="mv">QR '+money(tot)+'</span></div>'+
      seen[m].map(function(e){
        var d = D[e.id];
        var meta = num(e.litres,2)+' L · QR '+num(e.amount/e.litres,2)+'/L' + (d ? ' · '+money0(d)+' km' : '');
        return '<div class="row" data-id="'+e.id+'">'+
          '<span class="rdot" style="--dot:'+colorOf(e.car)+'"></span>'+
          '<div class="rmain"><div class="rdate">'+dayLabel(e.date)+'<span class="rcar">'+esc(carOf(e.car).name)+'</span></div>'+
          '<div class="rmeta">'+meta+'</div></div>'+
          '<div><div class="ramt">'+money(e.amount)+'</div>'+
          '<div class="rsub">'+(d ? num(d/e.litres,1)+' km/L' : 'odo '+money0(e.odo))+'</div></div>'+
          '<button class="del" type="button" aria-label="Delete this fill-up">✕</button>'+
          '</div>';
      }).join('')+'</div>';
  }).join('') + (hidden > 0
    ? '<button class="btn btn-ghost showall" type="button" id="showAllBtn">Show '+hidden+' earlier fill-up'+(hidden===1?'':'s')+'</button>'
    : '');

  var sa = document.getElementById('showAllBtn');
  if (sa) sa.addEventListener('click', function(){ showAll = true; renderLog(); });
}

function renderFoot(){
  var list = sortedFills();
  var all = list.reduce(function(a,e){ return a + e.amount; }, 0);
  document.getElementById('foot').textContent = list.length
    ? 'QR '+money(all)+' across '+list.length+' fill-ups since '+ymLabel(ymOf(list[list.length-1].date),'long')+'. Efficiency assumes you fill the tank each time.'
    : (connected() ? 'Anything either of you logs shows up on both phones.' : 'Saved on this device. Tap the pill up top to share it with someone.');
}

function renderCarPickers(){
  var cs = cars(), prev = (document.querySelector('input[name=car]:checked')||{}).value;
  document.getElementById('carSeg').innerHTML = cs.map(function(c,i){
    var on = prev ? c.id===prev : i===0;
    return '<label style="--dot:'+colorOf(c.id)+'"><input type="radio" name="car" value="'+esc(c.id)+'"'+(on?' checked':'')+'><span>'+esc(c.name)+'</span></label>';
  }).join('');
  // Don't rebuild the name fields under someone who is typing in them.
  var names = document.getElementById('carNames');
  var editing = document.querySelector('details.set').open && names.children.length;
  if (!editing){
    names.innerHTML = cs.map(function(c,i){
      return '<div class="field wide"><label class="lbl" for="nm_'+esc(c.id)+'">Car '+(i+1)+' name</label>'+
        '<input id="nm_'+esc(c.id)+'" type="text" maxlength="28" value="'+esc(c.name)+'"></div>';
    }).join('');
  }
}

/* ---------- toast ---------- */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/* ---------- form ---------- */
var fAmount = document.getElementById('fAmount'),
    fLitres = document.getElementById('fLitres'),
    fOdo    = document.getElementById('fOdo'),
    fDate   = document.getElementById('fDate'),
    pplHint = document.getElementById('pplHint'),
    odoWarn = document.getElementById('odoWarn'),
    formMsg = document.getElementById('formMsg');
fDate.value = todayISO();

function selectedCar(){
  var r = document.querySelector('input[name=car]:checked');
  return r ? r.value : (cars()[0]||{}).id;
}
function updateHints(){
  var a = parseFloat(fAmount.value), l = parseFloat(fLitres.value);
  pplHint.innerHTML = (a>0 && l>0) ? 'That is <b>QR '+num(a/l,2)+'</b> per litre' : '';
  var o = parseFloat(fOdo.value), last = carStats(selectedCar()).last;
  if (last && o > 0 && fDate.value >= last.date && o <= last.odo){
    odoWarn.textContent = 'Lower than this car’s last reading of '+money0(last.odo)+' km — double-check the odometer.';
    odoWarn.classList.remove('hidden');
  } else if (last && o > 0 && fDate.value >= last.date && (o - last.odo) > 2500){
    odoWarn.textContent = money0(o-last.odo)+' km since the last fill-up — double-check the odometer.';
    odoWarn.classList.remove('hidden');
  } else {
    odoWarn.classList.add('hidden');
  }
}
['input','change'].forEach(function(ev){ document.getElementById('addForm').addEventListener(ev, updateHints); });

document.getElementById('addForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var a = parseFloat(fAmount.value), l = parseFloat(fLitres.value), o = parseFloat(fOdo.value);
  formMsg.className = 'msg err';
  if (!(a > 0)){ formMsg.textContent = 'Enter the amount you paid.'; fAmount.focus(); return; }
  if (!(l > 0)){ formMsg.textContent = 'Enter how many litres went in.'; fLitres.focus(); return; }
  if (!fOdo.value || !(o >= 0)){ formMsg.textContent = 'Enter the odometer reading.'; fOdo.focus(); return; }
  if (!fDate.value){ formMsg.textContent = 'Pick a date.'; fDate.focus(); return; }

  put(rid("f"), "fill", {
    date: fDate.value, car: selectedCar(),
    amount: Math.round(a*100)/100, litres: Math.round(l*100)/100, odo: Math.round(o)
  });

  fAmount.value = ''; fLitres.value = ''; fOdo.value = ''; fDate.value = todayISO();
  formMsg.textContent = '';
  updateHints();
  document.getElementById('addPanel').open = false;
  render();
  toast(connected() ? 'Fill-up saved' : 'Fill-up saved on this device');
  queueSync();
});

/* ---------- delete ---------- */
document.getElementById('log').addEventListener('click', function(ev){
  var btn = ev.target.closest('.del');
  if (btn){
    var row = btn.closest('.row');
    if (row.querySelector('.confirm')) return;
    var c = document.createElement('div');
    c.className = 'confirm';
    c.innerHTML = 'Delete? <button type="button" class="yes">Yes</button><button type="button" class="no">No</button>';
    btn.replaceWith(c);
    return;
  }
  if (ev.target.closest('.confirm .no')){ renderLog(); return; }
  var yes = ev.target.closest('.confirm .yes');
  if (yes){
    var id = yes.closest('.row').getAttribute('data-id');
    var it = db.items[id];
    if (it) put(id, it.kind, it.doc, true);
    render();
    toast('Fill-up deleted');
    queueSync();
  }
});

/* ---------- settings ---------- */
var setMsg = document.getElementById('setMsg');
document.getElementById('saveNames').addEventListener('click', function(){
  cars().forEach(function(c){
    var el = document.getElementById('nm_'+c.id);
    if (!el) return;
    var v = el.value.trim().slice(0,28);
    if (v && v !== c.name) put(c.id, "car", {name:v, order:c.order});
  });
  render();
  setMsg.className = 'msg ok'; setMsg.textContent = 'Saved.';
  toast('Car names saved');
  queueSync();
});

document.getElementById('exportBtn').addEventListener('click', function(){
  var D = distances();
  var rows = [['date','car','amount_qr','litres','qr_per_litre','odometer_km','km_since_last','km_per_litre']];
  sortedFills().slice().reverse().forEach(function(e){
    var d = D[e.id];
    rows.push([e.date, carOf(e.car).name, e.amount.toFixed(2), e.litres.toFixed(2),
      (e.amount/e.litres).toFixed(3), e.odo, d||'', d?(d/e.litres).toFixed(2):'']);
  });
  var csv = rows.map(function(r){ return r.map(function(v){
    v = String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'forecourt-fill-ups.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

/* ---------- sharing sheet ---------- */
var modal = document.getElementById('modal');
function closeSheet(){ modal.classList.remove('on'); modal.innerHTML = ''; }
modal.addEventListener('click', function(e){ if (e.target === modal) closeSheet(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && modal.classList.contains('on')) closeSheet(); });

function openSharing(){
  var body;
  if (connected()){
    body =
      '<p>This log is shared. Open the link below on any phone or laptop and it joins the same log — fill-ups either of you save show up on both.</p>'+
      '<div class="field"><label class="lbl" for="lnk">Share link</label>'+
      '<div class="linkrow"><input id="lnk" class="mono" type="text" readonly value="'+esc(shareLink())+'">'+
      '<button class="btn" type="button" id="copyLnk">Copy</button></div></div>'+
      '<p style="font-size:12.5px;color:var(--ink3)">Household code <b>'+esc(cfg.hh)+'</b> · anyone with the link can read and write this log, so keep it between the two of you.</p>'+
      '<button class="btn btn-ghost" type="button" id="syncNow">Sync now</button>'+
      '<button class="btn btn-ghost" type="button" id="disconnect">Disconnect this device</button>';
  } else {
    body =
      '<p>Right now everything is saved on this device only. Connect a Supabase project to share the log — or just open the link you were sent, which fills all of this in for you.</p>'+
      '<div class="field"><label class="lbl" for="cfgUrl">Project URL</label>'+
      '<input id="cfgUrl" class="mono" type="url" placeholder="https://xxxx.supabase.co" value="'+esc(cfg.url||'')+'"></div>'+
      '<div class="field"><label class="lbl" for="cfgKey">Publishable key</label>'+
      '<input id="cfgKey" class="mono" type="text" placeholder="sb_publishable_…" value="'+esc(cfg.key||'')+'"></div>'+
      '<div class="field"><label class="lbl" for="cfgHh">Household code</label>'+
      '<input id="cfgHh" class="mono" type="text" placeholder="leave empty to make a new one" value="'+esc(cfg.hh||'')+'"></div>'+
      '<button class="btn" type="button" id="doConnect">Connect</button>';
  }

  modal.innerHTML =
    '<div class="sheet">'+
      '<div class="sheet-head"><h3 id="sheetTitle">Sharing &amp; sync</h3>'+
      '<button class="xbtn" type="button" id="sheetX" aria-label="Close">✕</button></div>'+
      body+
      '<div class="msg" id="sheetMsg"></div>'+
    '</div>';
  modal.classList.add('on');

  document.getElementById('sheetX').addEventListener('click', closeSheet);
  var sm = document.getElementById('sheetMsg');

  var copy = document.getElementById('copyLnk');
  if (copy) copy.addEventListener('click', function(){
    var inp = document.getElementById('lnk');
    inp.select(); inp.setSelectionRange(0, 99999);
    var done = function(){ toast('Link copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(inp.value).then(done, function(){ document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  });

  var now = document.getElementById('syncNow');
  if (now) now.addEventListener('click', function(){ sync().then(function(){ toast('Synced'); }); });

  var dis = document.getElementById('disconnect');
  if (dis) dis.addEventListener('click', function(){
    if (dis.dataset.armed !== '1'){
      dis.dataset.armed = '1';
      dis.textContent = 'Tap again to disconnect — the log stays on the server';
      return;
    }
    cfg = {url:"", key:"", hh:""}; saveCfg();
    setSync('off'); closeSheet(); render();
    toast('Disconnected — this device is local only');
  });

  var go = document.getElementById('doConnect');
  if (go) go.addEventListener('click', function(){
    var u = document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
    var k = document.getElementById('cfgKey').value.trim();
    var h = document.getElementById('cfgHh').value.trim() || ('hh-' + Math.random().toString(36).slice(2,12));
    if (!/^https?:\/\//.test(u)){ sm.className='msg err'; sm.textContent='The project URL should start with https://'; return; }
    if (!k){ sm.className='msg err'; sm.textContent='Paste the publishable key from your Supabase project.'; return; }
    cfg.url = u; cfg.key = k; cfg.hh = h; saveCfg();
    Object.keys(db.items).forEach(function(id){ db.pending[id] = true; });  // seed the new household
    saveDb();
    closeSheet();
    sync().then(function(){ render(); toast('Connected'); });
  });
}
document.getElementById('syncPill').addEventListener('click', openSharing);
document.getElementById('shareBtn').addEventListener('click', openSharing);

/* ---------- boot ---------- */
readHash();
ensureCars();
render();
if (!fills().length) document.getElementById('addPanel').open = true;
setSync(connected() ? 'busy' : 'off');
sync().then(function(){ ensureCars(); render(); });

window.addEventListener('online',  function(){ sync(); });
window.addEventListener('offline', function(){ setSync('offline'); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) sync(); });
setInterval(function(){ if (!document.hidden) sync(); }, 60000);

var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ renderChart(ymOf(todayISO())); }, 160);
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
